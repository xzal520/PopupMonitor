name: Android Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4 # 强制使用稳定的 8.4 版本，避免系统默认的 9.3 开发版

    - name: Build with Gradle
      run: gradle assembleDebug # 直接使用 gradle 命令，setup-gradle 会确保这是 8.4 版本

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PopupMonitor-APK
        path: app/build/outputs/apk/debug/app-debug.apk
